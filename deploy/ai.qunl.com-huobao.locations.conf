# Optional location snippet for an existing site; no certificate configuration.
# huobao_qunl must point to Qunl, never directly to the Huobao service.
location ^~ /internal/huobao/ {
    return 404;
}

location = /huobao {
    return 301 /huobao/;
}

location ^~ /huobao/ {
    proxy_pass http://huobao_qunl;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /huobao;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
