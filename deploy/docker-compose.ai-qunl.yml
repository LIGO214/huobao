services:
  app:
    extends:
      file: ../docker-compose.yml
      service: app

  postgres:
    extends:
      file: ../docker-compose.yml
      service: postgres

volumes:
  huobao-web-data:
  huobao-postgres:

networks:
  database:
    internal: true
  qunl:
    external: true
    name: ${QUNL_DOCKER_NETWORK:?Set the existing trusted Qunl Docker network}
