# Single-instance Web deployment. Qunl is the only public application entry.
# Attach Qunl to the configured shared network before enabling its proxy.

services:
  app:
    image: huobao/huobao-drama:latest
    build:
      context: .
      args:
        HUOBAO_VERSION: ${HUOBAO_VERSION:-dev}
        NUXT_APP_BASE_URL: /huobao/
    expose:
      - "5679"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL for the app service}
      HUOBAO_PROXY_SECRET: ${HUOBAO_PROXY_SECRET:?Set a shared service secret of at least 32 characters}
      HUOBAO_MODEL_CONFIG_SOURCE: user
      HUOBAO_DATA_DIR: /app/data
      HUOBAO_CORS_ORIGINS: ${HUOBAO_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - qunl
    volumes:
      - huobao-web-data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: huobao
      POSTGRES_USER: huobao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huobao -d huobao"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - huobao-postgres:/var/lib/postgresql/data
    networks:
      - database
    restart: unless-stopped

volumes:
  huobao-web-data:
  huobao-postgres:

networks:
  database:
    internal: true
  qunl:
    external: true
    name: ${QUNL_DOCKER_NETWORK:?Set the existing trusted Qunl Docker network}
